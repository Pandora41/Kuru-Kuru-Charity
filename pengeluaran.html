<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style-pengeluaran.css">
    <link rel="shortcut icon" href="image/icon.svg" type="">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <title>SPMP</title>
</head>

<body>
    <nav>
        <header>
            <div class="image-text">
                <span class="image">
                    <img src="image/icon.svg" alt="">
                </span>
                <div class="text header-text">
                    <span class="name">SPMP</span>
                    <span class="subname">SMKN 2 Bandung</span>
                </div>
            </div>
        </header>

        <div class="menu-items">
            <ul class="nav-links">
                <li><a class="list-link" href="index.html">
                        <i class='bx bx-home-alt'></i>
                        <span class="link-name">Dahsboard</span>
                    </a></li>
                <li><a class="list-link" href="pendapatan.html">
                        <i class='bx bxs-archive-in'></i>
                        <span class="link-name">Pendapatan</span>
                    </a></li>
                <li><a class="list-link" href="pengeluaran.html">
                        <i class='bx bx-archive-out'></i>
                        <span class="link-name">Pengeluaran</span>
                    </a></li>
                <li><a href="kuitansi.html">
                        <i class='bx bx-receipt'></i>
                        <span class="link-name">Kuitansi</span>
                    </a></li>
            </ul>

            <ul class="logout-mode">
                <li><a href="#">
                        <i class="uil uil-signout"></i>
                        <span class="link-name">Logout</span>
                    </a></li>
                <li class="mode">
                    <a href="#">
                        <i class="uil uil-moon"></i>
                        <span class="link-name">Dark Mode</span>
                    </a>
                    <div class="mode-toggle">
                        <span class="switch"></span>
                    </div>
                </li>
            </ul>
        </div>
    </nav>
    
    <section class="dashboard">
        
        <div class="top">
            <i class="uil uil-bars sidebar-toggle"></i>

            <div class="search-box">
                <i class="uil uil-search"></i>
                <input class="submit" type="submit" value="">
                <input class="search" type="text" placeholder="Search here...">
            </div>
        </div>
        <div class="dash-content">
            <div class="overview">
                <div class="title">
                    <i class='bx bx-line-chart-down'></i>
                    <span class="text">Pengeluaran</span>
                </div>
                <div class="boxes">
                    
                    <div class="box box3">
                        <div class="header-box">
                            <i class='bx bxs-graduation'></i>
                            <span class="text">Saldo</span>
                        </div>
                        <span class="number">Rp. 200,000,000</span>
                    </div>
                    <div class="box box1">
                        <div class="header-box">
                            <i class='bx bx-money'></i>
                            <span class="text">Total</span>
                        </div>
                        <span class="number">Rp. 5,000,000</span>
                    </div>
                </div>
            </div>

            <div class="activity">
                <div class="header-activity">
                    <a class="links add-link" href="dist/add-pengeluaran.html"><i class='bx bx-plus-circle'></i>Tambah</a>
                </div>
                <div class="activity-data">
                    <div class="table-container">
                        <table>
                          <tr>
                            <th class="small-column">No</th>
                            <th>Tanggal</th>
                            <th class="wide-column">Keterangan</th>
                            <th>Nominal</th>
                            <!-- fitur admin -->
                            <th>Opsi</th>
                            <!-- fitur admin -->
                          </tr>
                          <tr>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <!-- fitur admin -->
                            <td class="option">
                                <a class="links edit-link" href="dist/edit-pengeluaran.html"><i class='bx bx-edit-alt' ></i></a>
                                <a class="links delete-link" href="Hapus.html"><i class='bx bx-trash' ></i></a>
                                <a class="links print-link" href="Hapus.html"><i class='bx bx-printer'></i></a>
                            </td>
                            <!-- fitur admin -->
                          </tr>
                        </table>
                      </div>
                      
                </div>
            </div>
        </div>
    </section>
    <script src="js/script.js"></script>
    <script src="js/script-indicator.js"></script>
</body>

</html>
